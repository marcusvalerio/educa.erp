<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ATLAS.ERP — captura real</title>
<style>
  @font-face { font-family: "Instrument Sans"; src: url("file:///home/user/educa.erp/src/app/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Instrument Sans"; src: url("file:///home/user/educa.erp/src/app/fonts/instrument-sans-latin-ext-wght-normal.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: "Instrument Serif"; src: url("file:///home/user/educa.erp/src/app/fonts/instrument-serif-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Instrument Serif"; src: url("file:///home/user/educa.erp/src/app/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 627px; overflow: hidden; background: #100c08; }
  body { font-family: "Instrument Sans", system-ui, sans-serif; color: #f3f4f5; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1200px; height: 627px; overflow: hidden;
    background: radial-gradient(560px 380px at 800px 330px, rgb(255 148 8 / 0.10), transparent 70%), #100c08; }
  .left { position: absolute; left: 56px; top: 0; bottom: 0; width: 270px; }
  .brand { position: absolute; top: 118px; display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 34px; height: 34px; }
  .wordmark { font-weight: 600; font-size: 31px; letter-spacing: -0.025em; line-height: 1; }
  .wordmark span { color: #8e9396; font-weight: 500; }
  .headline { position: absolute; top: 190px; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 43px; line-height: 1.04; letter-spacing: -0.01em; }
  .headline em { font-style: italic; color: #d9dbdc; }
  .areas { position: absolute; top: 312px; font-size: 13px; line-height: 1.75; color: #a9adaf; }
  .areas i { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: #5d6265; margin: 0 7px; vertical-align: middle; }
  .credit { position: absolute; bottom: 64px; font-size: 11.5px; letter-spacing: .04em; color: #8e9396; }
  .credit b { font-weight: 500; color: #c9cccd; }
  /* a captura: plana, proporção original (1440×900 → 800×500), nada por cima */
  .shot { position: absolute; left: 356px; top: 63px; width: 800px; height: 500px; display: block;
    outline: 1px solid rgb(243 244 245 / .10);
    box-shadow: 0 40px 80px -24px rgb(0 0 0 / .9), 0 0 0 1px rgb(0 0 0 / .6); }
</style>
</head>
<body>
<div class="stage">
  <section class="left">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-label="Símbolo Núcleo do ATLAS.ERP">
        <rect x="3" y="3" width="16" height="8" rx="1.4" fill="#f3f4f5"/>
        <rect x="21" y="3" width="8" height="16" rx="1.4" fill="#f3f4f5"/>
        <rect x="13" y="21" width="16" height="8" rx="1.4" fill="#f3f4f5"/>
        <rect x="3" y="13" width="8" height="16" rx="1.4" fill="#f3f4f5"/>
        <rect x="13" y="13" width="6" height="6" rx="1.4" fill="#ff9408"/>
      </svg>
      <div class="wordmark">ATLAS<span>.ERP</span></div>
    </div>
    <h1 class="headline">Uma operação<br>inteira, <em>conectada.</em></h1>
    <p class="areas">Comercial<i></i>Compras<i></i>Estoque<br>Financeiro<i></i>Fiscal<i></i>Logística</p>
    <p class="credit">Criado por <b>Marcus Valério</b></p>
  </section>
  <img class="shot" src="captura-real-inicio-ferrix-1440x900@2x-escuro.png" alt="Tela Início do ATLAS.ERP (captura real)">
</div>
</body>
</html>
